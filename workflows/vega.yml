name: Gerar VPKG (Vega OS)
on:
  workflow_dispatch:
    inputs:
      marca: { description: 'plustv ou txgold', type: string, default: 'plustv' }
      dono:  { description: 'Opcional: link /player/<dono>', type: string, default: '' }
jobs:
  vega:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Instalar Vega SDK (grande, ~20 GB)
        run: |
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh | bash
          source ~/vega/env
          vega --version || true
          echo "$HOME/vega/bin" >> "$GITHUB_PATH"
      - name: Gerar
        run: |
          source ~/vega/env
          ./generate.sh "${{ inputs.marca }}" "${{ inputs.dono }}"
      - uses: actions/upload-artifact@v4
        with:
          name: vpkg-${{ inputs.marca }}
          path: out/**/build/**/*.vpkg
